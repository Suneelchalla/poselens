function LS(c,t){
  const base=(EXTRA[c]&&EXTRA[c][t])?EXTRA[c][t]:LST[t];
  const ex=new Set(EX[c]||[]);
  return base.filter(x=>!ex.has(x[0]));
}

function getDirectorPrompt(p){
  const n=p.name.toLowerCase();
  if(/whisper/.test(n)) return '“Whisper the funniest memory you have of us—right now, without laughing.”';
  if(/walk|stroll|steps/.test(n)) return '“Walk toward me in slow motion, bump shoulders gently, and look at each other—not the camera.”';
  if(/run|sprint|chase/.test(n)) return '“Race each other toward me on three—whoever loses buys coffee!”';
  if(/jump|toss|cheer/.test(n)) return '“Big breath in—on three, explode up and shout your loudest cheer!”';
  if(/kiss|forehead|nose/.test(n)) return '“Close your eyes, take one slow breath together, and hold that quiet second.”';
  if(/laugh|giggle|tickle/.test(n)) return '“Do your worst fake evil laugh until it turns into a real one!”';
  if(/dance|twirl/.test(n)) return '“Spin slowly like there’s music playing—let your chin follow your shoulder.”';
  if(/peek/.test(n)) return '“Where did baby go? Count one, two… BOO!”';
  if(/bump/.test(n)) return '“Look down at the bump and tell the baby one thing you can’t wait to show them.”';
  if(/glance|shoulder/.test(n)) return '“Turn away from me, relax your shoulders, then look back like I just called your name.”';
  if(/sit|bench|floor|blanket|cuddle/.test(n)) return '“Lean your weight into each other like you’ve been sitting here for an hour.”';
  return '“Drop your shoulders on an exhale, soften your jaw, and look just past my lens.”';
}

function getSubgroup(p){
  const n=p.name.toLowerCase();
  if(p.c===15&&p.t===0){
    if(/toddler|first steps|standing/.test(n)) return 'Toddler & Kids';
    if(/lying|curl|basket|sleepy|feet/.test(n)) return 'Newborn & Infant';
    return 'Sitting & Crawling';
  }
  if(p.mo===1||/walk|run|jump|twirl|sprint|crawl|toss|steps|dance|cheer|airplane/.test(n)) return 'Walking & Motion';
  if(/sit|seated|bench|ground|crouch|squat|lunge|floor|lap|lying|basket/.test(n)) return 'Sitting & Floor';
  if(p.f>=2||/kiss|whisper|touch|hug|huddle|peek|hair|chin|glance|look down|flex|towel|hold/.test(n)) return 'Close-Up & Emotion';
  return 'Standing & Stance';
}

function defaultOrder(){return CATS.map((_,idx)=>idx);}
function loadOrder(){
  try{
    const saved=JSON.parse(localStorage.getItem('poselens_order')||'null');
    if(Array.isArray(saved)&&saved.length===CATS.length){
      const valid=new Set(saved);
      if(valid.size===CATS.length&&saved.every(n=>Number.isInteger(n)&&n>=0&&n<CATS.length)) return saved;
    }
  }catch(_){}
  return defaultOrder();
}

  const meta=document.getElementById('metaTheme');
  if(meta) meta.setAttribute('content',isDark?'#08090c':'#f2f0ed');

function saveState(){
  localStorage.setItem('poselens_chk',JSON.stringify([...state.checked]));
  localStorage.setItem('poselens_order',JSON.stringify(state.order));
  if(state.theme==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',state.theme);
  localStorage.setItem('poselens_theme',state.theme);
  syncThemeMeta();
}

function attachSwipe(el, {onNext, onPrev}){
  if(!el) return;
  let startX=0, startY=0, dx=0, tracking=false, lockedHorizontal=false, startTime=0;
  let suppressClick=false;

  el.addEventListener('click', e=>{
    if(suppressClick){
      e.preventDefault();
      e.stopPropagation();
      suppressClick=false;
    }
  }, true);

  function onDown(clientX, clientY){
    startX=clientX;
    startY=clientY;
    dx=0;
    tracking=true;
    lockedHorizontal=false;
    startTime=performance.now();
    el.style.transition='none';
  }

  function onMove(clientX, clientY, e){
    if(!tracking) return;
    const moveX=clientX-startX;
    const moveY=clientY-startY;
    if(!lockedHorizontal){
      if(Math.abs(moveX)>12 && Math.abs(moveX)>Math.abs(moveY)*1.25){
        lockedHorizontal=true;
        suppressClick=true;
      } else if(Math.abs(moveY)>14){
        tracking=false;
        el.style.transition='';
        el.style.transform='';
        el.style.opacity='';
        return;
      }
    }
    if(lockedHorizontal){
      if(e&&e.cancelable) e.preventDefault();
      dx=moveX;
      const rot=cl(dx*0.035, -7, 7);
      const op=cl(1 - Math.abs(dx)/600, 0.65, 1);
      el.style.transform=`translate3d(${dx}px,0,0) rotate(${rot}deg)`;
      el.style.opacity=String(op);
    }
  }

  function onUp(){
    if(!tracking) return;
    tracking=false;
    const dt=Math.max(1, performance.now()-startTime);
    const vx=dx/dt;
    const triggered=Math.abs(dx)>72 || (lockedHorizontal && Math.abs(vx)>0.45 && Math.abs(dx)>28);

    if(triggered){
      const goNext=dx<0;
      const exitX=goNext ? -window.innerWidth*0.75 : window.innerWidth*0.75;
      el.style.transition='transform .2s cubic-bezier(.32,.72,0,1), opacity .2s ease';
      el.style.transform=`translate3d(${exitX}px,0,0) rotate(${goNext?-6:6}deg)`;
      el.style.opacity='0';
      setTimeout(()=>{
        el.style.transition='';
        el.style.transform='';
        el.style.opacity='';
        if(goNext && onNext) onNext();
        else if(!goNext && onPrev) onPrev();
        setTimeout(()=>{suppressClick=false;}, 60);
      }, 175);
    } else {
      el.style.transition='transform .26s cubic-bezier(.22,1,.36,1), opacity .26s ease';
      el.style.transform='translate3d(0,0,0) rotate(0deg)';
      el.style.opacity='1';
      setTimeout(()=>{suppressClick=false;}, 60);
    }
  }

  el.addEventListener('touchstart', e=>{
    if(e.touches.length!==1) return;
    onDown(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});

  el.addEventListener('touchmove', e=>{
    if(e.touches.length!==1) return;
    onMove(e.touches[0].clientX, e.touches[0].clientY, e);
  }, {passive:false});

  el.addEventListener('touchend', onUp, {passive:true});
  el.addEventListener('touchcancel', onUp, {passive:true});

  el.addEventListener('mousedown', e=>{
    if(e.button!==0) return;
    onDown(e.clientX, e.clientY);
    const moveWin=ev=>onMove(ev.clientX, ev.clientY, ev);
    const upWin=()=>{
      window.removeEventListener('mousemove', moveWin);
      window.removeEventListener('mouseup', upWin);
      onUp();
    };
    window.addEventListener('mousemove', moveWin);
    window.addEventListener('mouseup', upWin);
  });
}

function figureSvg(poseArr,x=120,y=124,scale=1,fill='#ffffff',accent='#ffd8a8',isBaby=false){
  const p=Array.isArray(poseArr)?poseArr:D;
  const torso=p[0]||0,head=p[1]||0;
  const lSh=p[2]||-8,lEl=p[3]||-4,rSh=p[4]||8,rEl=p[5]||4;
  const lHp=p[6]||-5,lKn=p[7]||-2,rHp=p[8]||5,rKn=p[9]||2;
  const hy=p[10]!=null?p[10]:y;
  const s=(p[11]!=null?p[11]:1)*scale;
  const rad=deg=>deg*Math.PI/180;

  const hipX=x,hipY=hy;
  const shLen=(isBaby?19:33)*s;
  const shX=hipX+Math.sin(rad(torso))*shLen;
  const shY=hipY-Math.cos(rad(torso))*shLen;
  const nkX=shX+Math.sin(rad(torso+head*0.5))*(5*s);
  const nkY=shY-Math.cos(rad(torso+head*0.5))*(5*s);
  const hdR=(isBaby?11.5:11)*s;
  const hdX=nkX+Math.sin(rad(torso+head))*(hdR*1.15);
  const hdY=nkY-Math.cos(rad(torso+head))*(hdR*1.15);
  const gazeAngle=rad(torso+head+22);
  const noseX=hdX+Math.sin(gazeAngle)*(hdR*0.78);
  const noseY=hdY-Math.cos(gazeAngle)*(hdR*0.25);

  const shOff=(isBaby?7:10)*s;
  const perpX=Math.cos(rad(torso))*shOff,perpY=Math.sin(rad(torso))*shOff;
  const lShX=shX-perpX,lShY=shY-perpY;
  const rShX=shX+perpX,rShY=shY+perpY;

  const uArm=(isBaby?14:23)*s,fArm=(isBaby?13:21)*s;
  const lElX=lShX+Math.sin(rad(lSh))*uArm,lElY=lShY+Math.cos(rad(lSh))*uArm;
  const lWrX=lElX+Math.sin(rad(lSh+lEl))*fArm,lWrY=lElY+Math.cos(rad(lSh+lEl))*fArm;
  const rElX=rShX+Math.sin(rad(rSh))*uArm,rElY=rShY+Math.cos(rad(rSh))*uArm;
  const rWrX=rElX+Math.sin(rad(rSh+rEl))*fArm,rWrY=rElY+Math.cos(rad(rSh+rEl))*fArm;

  const hpOff=(isBaby?5.5:7)*s;
  const lHpX=hipX-Math.cos(rad(torso))*hpOff,lHpY=hipY-Math.sin(rad(torso))*hpOff;
  const rHpX=hipX+Math.cos(rad(torso))*hpOff,rHpY=hipY+Math.sin(rad(torso))*hpOff;

  const uLeg=(isBaby?15:27)*s,lLeg=(isBaby?15:27)*s;
  const lKnX=lHpX+Math.sin(rad(lHp))*uLeg,lKnY=lHpY+Math.cos(rad(lHp))*uLeg;
  const lFtX=lKnX+Math.sin(rad(lHp+lKn))*lLeg,lFtY=lKnY+Math.cos(rad(lHp+lKn))*lLeg;
  const rKnX=rHpX+Math.sin(rad(rHp))*uLeg,rKnY=rHpY+Math.cos(rad(rHp))*uLeg;
  const rFtX=rKnX+Math.sin(rad(rHp+rKn))*lLeg,rFtY=rKnY+Math.cos(rad(rHp+rKn))*lLeg;

  const limbW=(isBaby?5.2:5.6)*s;
  const foreW=(isBaby?4.2:4.5)*s;
  const jr=(isBaby?2.2:2.4)*s;

  return `<g stroke-linecap="round" stroke-linejoin="round">
    <line x1="${lShX}" y1="${lShY}" x2="${lElX}" y2="${lElY}" stroke="${fill}" stroke-opacity="0.72" stroke-width="${limbW}"/>
    <line x1="${lElX}" y1="${lElY}" x2="${lWrX}" y2="${lWrY}" stroke="${fill}" stroke-opacity="0.72" stroke-width="${foreW}"/>
    <line x1="${lHpX}" y1="${lHpY}" x2="${lKnX}" y2="${lKnY}" stroke="${fill}" stroke-opacity="0.75" stroke-width="${limbW*1.12}"/>
    <line x1="${lKnX}" y1="${lKnY}" x2="${lFtX}" y2="${lFtY}" stroke="${fill}" stroke-opacity="0.75" stroke-width="${foreW*1.08}"/>
    <polygon points="${lShX},${lShY} ${rShX},${rShY} ${rHpX},${rHpY} ${lHpX},${lHpY}" fill="${fill}" fill-opacity="0.92" stroke="${fill}" stroke-width="${3*s}"/>
    <line x1="${rHpX}" y1="${rHpY}" x2="${rKnX}" y2="${rKnY}" stroke="${fill}" stroke-width="${limbW*1.15}"/>
    <line x1="${rKnX}" y1="${rKnY}" x2="${rFtX}" y2="${rFtY}" stroke="${fill}" stroke-width="${foreW*1.1}"/>
    <line x1="${rShX}" y1="${rShY}" x2="${rElX}" y2="${rElY}" stroke="${fill}" stroke-width="${limbW}"/>
    <line x1="${rElX}" y1="${rElY}" x2="${rWrX}" y2="${rWrY}" stroke="${fill}" stroke-width="${foreW}"/>
    <circle cx="${lWrX}" cy="${lWrY}" r="${jr}" fill="${accent}"/>
    <circle cx="${rWrX}" cy="${rWrY}" r="${jr}" fill="${accent}"/>
    <circle cx="${lFtX}" cy="${lFtY}" r="${jr}" fill="${fill}"/>
    <circle cx="${rFtX}" cy="${rFtY}" r="${jr}" fill="${fill}"/>
    <circle cx="${hdX}" cy="${hdY}" r="${hdR}" fill="${fill}"/>
    <circle cx="${noseX}" cy="${noseY}" r="${Math.max(1.6,2*s)}" fill="${accent}"/>
  </g>`;
}

let svgUid=0;
function poseSvg(p,mirror=false,detailed=false){
  const gid=`g_${p.c}_${p.t}_${p.i}_${++svgUid}`;
  const bg1=p.C.col,bg2='#12141b';
  let body='';
  if(p.t===0){
    const isBaby=p.c===15;
    body=figureSvg(p.d[5],120,isBaby?104:122,isBaby?1.12:1.02,'#ffffff','#ffd43b',isBaby);
  }else if(p.t===1){
    const off=p.d[7]||56;
    const x1=120-off/2,x2=120+off/2;
    const b2=p.c===15&&Array.isArray(p.d[6]);
    body=figureSvg(p.d[5],x1,122,.94,'#ffffff','#74c0fc',false)+figureSvg(p.d[6],x2,122,b2?.78:.94,'#ffe8a3','#ff922b',b2);
  }else{
    const cnt=typeof p.d[5]==='number'?p.d[5]:4;
    const span=Math.min(168,cnt*33);
    for(let k=0;k<cnt;k++){
      const px=120-span/2+(cnt>1?(k/(cnt-1))*span:0);
      const py=k%2===0?124:118;
      const col=k%2===0?'#ffffff':'#ffe8a3';
      body+=figureSvg(mk(),px,py,.80,col,'#74c0fc',false);
    }
  }

  const cropRects=[[22,12,196,156],[32,14,176,126],[42,16,156,96],[56,18,128,72]];
  const [rx,ry,rw,rh]=cropRects[p.f]||cropRects[0];
  const camShort=p.cam.split(',')[0];

  return `<svg viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="${gid}" cx="50%" cy="35%" r="75%">
        <stop offset="0%" stop-color="${bg1}"/>
        <stop offset="100%" stop-color="${bg2}"/>
      </radialGradient>
    </defs>
    <rect width="240" height="180" fill="url(#${gid})"/>
    <g stroke="#ffffff" stroke-opacity="${detailed?0.16:0.09}" stroke-width="0.8">
      <line x1="80" y1="0" x2="80" y2="180"/><line x1="160" y1="0" x2="160" y2="180"/>
      <line x1="0" y1="60" x2="240" y2="60"/><line x1="0" y1="120" x2="240" y2="120"/>
    </g>
    <ellipse cx="120" cy="160" rx="74" ry="8" fill="#00000044"/>
    <g ${mirror?'transform="translate(240,0) scale(-1,1)"':''}>
      ${body}
    </g>
    <rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" rx="8" fill="none" stroke="#ffffff" stroke-opacity="${detailed?0.55:0.28}" stroke-width="1.2" stroke-dasharray="5 4"/>
    ${detailed?`
      <g font-family="-apple-system,system-ui,sans-serif" font-size="9.5" font-weight="700">
        <rect x="8" y="8" width="88" height="18" rx="6" fill="#00000066"/>
        <text x="14" y="20" fill="#fff">📐 ${esc(FR[p.f])}</text>
        <rect x="8" y="154" width="132" height="18" rx="6" fill="#00000066"/>
        <text x="14" y="166" fill="#ffd43b">🎥 ${esc(camShort)}</text>
      </g>
    `:''}
  </svg>`;
}

function lightingDiagramSvg(s,idx){
  const {kx,ky,fx,fy,cx,cy,key,fill,cam}=s.diag;
  const uid=`ld_${idx}_${++svgUid}`;
  return `<svg viewBox="0 0 240 175" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="${uid}" cx="${(kx/240*100).toFixed(0)}%" cy="${(ky/175*100).toFixed(0)}%" r="70%">
        <stop offset="0%" stop-color="#ff922b" stop-opacity="0.38"/>
        <stop offset="100%" stop-color="#13151b" stop-opacity="1"/>
      </radialGradient>
    </defs>
    <rect width="240" height="175" fill="#13151b"/>
    <rect width="240" height="175" fill="url(#${uid})"/>
    <line x1="${kx}" y1="${ky}" x2="120" y2="90" stroke="#ffd43b" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="${fx}" y1="${fy}" x2="120" y2="90" stroke="#74c0fc" stroke-width="1.6" stroke-dasharray="3 3"/>
    <line x1="${cx}" y1="${cy}" x2="120" y2="90" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.4"/>
    <circle cx="120" cy="90" r="14" fill="#ffffff22" stroke="#fff" stroke-width="1.5"/>
    <circle cx="120" cy="90" r="6" fill="#fff"/>
    <text x="120" y="71" text-anchor="middle" fill="#fff" font-size="9.5" font-weight="700" font-family="system-ui,sans-serif">SUBJECT</text>
    <circle cx="${kx}" cy="${ky}" r="10" fill="#ffd43b"/>
    <text x="${kx}" y="${ky<32?ky+21:ky-14}" text-anchor="middle" fill="#ffd43b" font-size="9" font-weight="700" font-family="system-ui,sans-serif">${esc(key)}</text>
    <rect x="${fx-11}" y="${fy-5}" width="22" height="10" rx="4" fill="#74c0fc"/>
    <text x="${fx}" y="${fy+18}" text-anchor="middle" fill="#74c0fc" font-size="9" font-weight="700" font-family="system-ui,sans-serif">${esc(fill)}</text>
    <rect x="${cx-12}" y="${cy-8}" width="24" height="15" rx="4" fill="#e8590c" stroke="#fff" stroke-width="1"/>
    <text x="${cx}" y="${cy+18}" text-anchor="middle" fill="#fff" font-size="9" font-weight="700" font-family="system-ui,sans-serif">📷 ${esc(cam)}</text>
  </svg>`;
}

function allPoses(){
  const list=[];
  for(const c of state.order){
    for(let t=0;t<3;t++){
      const arr=LS(c,t);
      for(let i=0;i<arr.length;i++) list.push(gen(c,state.set,t,i));
    }
  }
  return list;
}

const poseKey=p=>`${p.c}:${p.t}:${p.i}`;
const isCustomOrder=()=>state.order.some((v,idx)=>v!==idx);

function moveCategory(pos,delta){
  const target=pos+delta;
  if(target<0||target>=state.order.length) return;
  const next=[...state.order];
  [next[pos],next[target]]=[next[target],next[pos]];
  state.order=next;
  saveState();
  renderHome();
}

function reorderCategoryTo(fromPos,toPos){
  if(fromPos===toPos||fromPos<0||toPos<0||fromPos>=state.order.length||toPos>=state.order.length) return;
  const next=[...state.order];
  const [moved]=next.splice(fromPos,1);
  next.splice(toPos,0,moved);
  state.order=next;
  saveState();
  renderHome();
}

function renderNav(active){
  const tb=document.getElementById('tb');
  const items=[
    ['#home','🏠','Home'],
    ['#poses','📸','Poses'],
    ['#light','💡','Lighting'],
    ['#check','✅','Checklist']
  ];
  tb.innerHTML=items.map(([h,ic,lb])=>`<a href="${h}" class="${active===h?'on':''}"><b>${ic}</b><span>${lb}</span></a>`).join('');
}

function renderHome(){
  renderNav('#home');
  const app=document.getElementById('app');
  const s=SET[state.set];
  app.innerHTML=`
    <button class="gfab" id="themeBtn">Theme: ${state.theme}</button>
    <h1>PoseLens</h1>
    <p class="sub">Offline on-set director, prompts &amp; camera recipes</p>
    <input class="sb" id="homeSearch" type="search" placeholder="Search poses, prompts, or focal lengths..." value="${esc(state.query)}">
    <div class="card">
      <div class="crumb">ACTIVE LIGHTING PRESET</div>
      <p><b>${s.e} ${esc(s.n)}</b> — <small>${esc(s.d)}</small></p>
      <p><small>ISO ${s.iso} · 1/${SH[s.sh]} · f/${STOPS[s.ap]} · WB ${esc(s.wb)}</small></p>
    </div>
    <div class="head-row">
      <h2>Categories</h2>
      ${isCustomOrder()?`<button class="mini-btn" id="resetOrderBtn">Reset Order</button>`:`<small class="sub" style="margin:0">Drag or tap ↑ ↓ to set favorites</small>`}
    </div>
    <div class="grid" id="catGrid">
      ${state.order.map((catIdx,pos)=>{
        const c=CATS[catIdx];
        const count=LS(catIdx,0).length+LS(catIdx,1).length+LS(catIdx,2).length;
        return `
          <div class="cc-wrap" draggable="true" data-pos="${pos}">
            <a class="cc" href="#poses?c=${catIdx}" style="--c:${c.col}">
              ${pos<3?`<span class="fav-tag">★ Favorite #${pos+1}</span>`:''}
              <span class="em">${c.e}</span>
              <b>${esc(c.n)}</b>
              <small>${count} poses</small>
            </a>
            <div class="ord-bar">
              <button class="ord-btn" data-mv="${pos}:-1" aria-label="Move ${esc(c.n)} up" ${pos===0?'disabled':''}>↑</button>
              <span class="drag-grip" title="Drag to reorder">⋮⋮</span>
              <button class="ord-btn" data-mv="${pos}:1" aria-label="Move ${esc(c.n)} down" ${pos===state.order.length-1?'disabled':''}>↓</button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;

  document.getElementById('themeBtn').onclick=()=>{
    const order=['auto','light','dark'];
    state.theme=order[(order.indexOf(state.theme)+1)%order.length];
    saveState();
    render();
  };
  const resetBtn=document.getElementById('resetOrderBtn');
  if(resetBtn){
    resetBtn.onclick=()=>{state.order=defaultOrder();saveState();renderHome();};
  }
  app.querySelectorAll('[data-mv]').forEach(btn=>{
    btn.onclick=e=>{
      e.preventDefault();
      e.stopPropagation();
      const [pos,delta]=btn.dataset.mv.split(':').map(Number);
      moveCategory(pos,delta);
    };
  });

  let dragFrom=-1;
  app.querySelectorAll('.cc-wrap').forEach(el=>{
    el.ondragstart=e=>{
      dragFrom=Number(el.dataset.pos);
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    };
    el.ondragend=()=>el.classList.remove('dragging');
    el.ondragover=e=>e.preventDefault();
    el.ondrop=e=>{
      e.preventDefault();
      const toPos=Number(el.dataset.pos);
      if(dragFrom>=0&&dragFrom!==toPos) reorderCategoryTo(dragFrom,toPos);
    };
  });

  const inp=document.getElementById('homeSearch');
  inp.oninput=e=>{
    state.query=e.target.value;
    if(state.query.trim()){
      location.hash='#poses';
      renderPoses();
      const el=document.getElementById('poseSearch');
      if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}
    }
  };
}

function renderPoses(){
  renderNav('#poses');
  const app=document.getElementById('app');
  const c=state.cat,t=state.type,q=state.query.trim().toLowerCase();
  const catObj=CATS[c];
  const labels=TL(c);
  const rawList=LS(c,t).map((_,i)=>gen(c,state.set,t,i));
  const subgroups=['All',...new Set(rawList.map(getSubgroup))];
  if(!subgroups.includes(state.sub)) state.sub='All';

  const baseList=q
    ? allPoses().filter(p=>p.name.toLowerCase().includes(q)||p.C.n.toLowerCase().includes(q)||p.tip.toLowerCase().includes(q)||getDirectorPrompt(p).toLowerCase().includes(q)||getSubgroup(p).toLowerCase().includes(q)||String(p.fo).includes(q))
    : rawList;

  const filtered=state.sub==='All'||q ? baseList : baseList.filter(p=>getSubgroup(p)===state.sub);

  app.innerHTML=`
    <div class="head-row">
      <a class="back" href="#home">← All categories</a>
      <button class="mini-btn" id="shuffleBtn">🎲 Random Idea</button>
    </div>
    <h2>${catObj.e} ${esc(catObj.n)}</h2>
    <p class="sub">${esc(catObj.n2)}</p>
    <input class="sb" id="poseSearch" type="search" placeholder="Filter poses, prompts, or subgroups..." value="${esc(state.query)}">
    <div class="pill-row">
      ${state.order.map(idx=>{
        const item=CATS[idx];
        return `<button class="pill ${idx===c&&!q?'on':''}" data-cat="${idx}">${item.e} ${esc(item.n)}</button>`;
      }).join('')}
    </div>
    <div class="pill-row">
      ${labels.map((lb,idx)=>`<button class="pill ${idx===t&&!q?'on':''}" data-type="${idx}">${esc(lb)}</button>`).join('')}
    </div>
    ${!q&&subgroups.length>2?`
      <div class="pill-row">
        ${subgroups.map(sg=>`<button class="pill ${sg===state.sub?'sub-on':''}" data-sub="${esc(sg)}">${esc(sg)}</button>`).join('')}
      </div>
    `:''}
    ${catObj.x?`<div class="card"><div class="crumb">SHOOT NOTE</div><p>${esc(catObj.x)}</p></div>`:''}
    <div class="grid">
      ${filtered.map(p=>`
        <a class="pc" href="#detail?c=${p.c}&t=${p.t}&i=${p.i}">
          <span class="th">${poseSvg(p,false,false)}</span>
          <div class="t">
            <div class="crumb">${esc(q?p.C.n:getSubgroup(p))}</div>
            <b>${esc(p.name)}</b>
            <small>${esc(sum(p))}</small>
          </div>
        </a>
      `).join('') || `<div class="card"><p>No matching poses found.</p></div>`}
    </div>
  `;

  document.getElementById('shuffleBtn').onclick=()=>{
    const pool=filtered.length?filtered:rawList;
    if(!pool.length) return;
    const pick=pool[Math.floor(Math.random()*pool.length)];
    state.swipeDir='next';
    location.hash=`#detail?c=${pick.c}&t=${pick.t}&i=${pick.i}`;
  };
  document.getElementById('poseSearch').oninput=e=>{
    state.query=e.target.value;
    renderPoses();
    const el=document.getElementById('poseSearch');
    if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}
  };
  app.querySelectorAll('[data-cat]').forEach(btn=>{
    btn.onclick=()=>{state.cat=Number(btn.dataset.cat);state.type=0;state.sub='All';state.query='';renderPoses();};
  });
  app.querySelectorAll('[data-type]').forEach(btn=>{
    btn.onclick=()=>{state.type=Number(btn.dataset.type);state.sub='All';state.query='';renderPoses();};
  });
  app.querySelectorAll('[data-sub]').forEach(btn=>{
    btn.onclick=()=>{state.sub=btn.dataset.sub;renderPoses();};
  });
}

function renderDetail(params){

  const c=cl(Number(params.get('c')??state.cat),0,CATS.length-1);
  const t=cl(Number(params.get('t')??state.type),0,2);
  const arr=LS(c,t);
  const i=cl(Number(params.get('i')||0),0,Math.max(0,arr.length-1));
  state.cat=c;state.type=t;
  const p=gen(c,state.set,t,i);
  const key=poseKey(p);
  const isChk=state.checked.has(key);

    <div class="nav">
      <button id="prevPoseBtn">← Previous</button>
      <button id="nextPoseBtn">Next →</button>
    </div>
  `;

  attachSwipe(document.getElementById('poseSwipeStage'), {onNext:goNext, onPrev:goPrev});
  document.getElementById('prevPoseBtn').onclick=goPrev;
  document.getElementById('nextPoseBtn').onclick=goNext;

  document.getElementById('rndPoseBtn').onclick=()=>{
    const r=Math.floor(Math.random()*arr.length);
    state.swipeDir='next';
    location.hash=`#detail?c=${c}&t=${t}&i=${r===i?(i+1)%arr.length:r}`;
  };
  document.getElementById('mirrorBtn').onclick=()=>{
    state.mirror=!state.mirror;
    renderDetail(params);
  };
  document.getElementById('chkBtn').onclick=()=>{
    if(state.checked.has(key)) state.checked.delete(key);
    else state.checked.add(key);
    saveState();
    renderDetail(params);
  };
}

function renderLight(){
  renderNav('#light');
  const app=document.getElementById('app');
  app.innerHTML=`
    <h1>Lighting</h1>
    <p class="sub">Top-down light placement &amp; exposure presets</p>
    ${SET.map((s,idx)=>`
      <div class="card">
        <p><b>${s.e} ${esc(s.n)}</b> <small>— ${esc(s.d)}</small></p>
        <div class="ld-box">${lightingDiagramSvg(s,idx)}</div>
        <p><small>ISO ${s.iso} · Shutter 1/${SH[s.sh]} · Aperture f/${STOPS[s.ap]} · EV ${esc(s.ec)}</small></p>
        <p><small><b>WB:</b> ${esc(s.wb)} · <b>Metering:</b> ${esc(s.mt)}</small></p>
        <p>${esc(s.lt)}</p>
        <p><small><b>Gear:</b> ${esc(s.g)}</small></p>
        <button class="btn ${state.set===idx?'':'sec'}" data-set="${idx}">${state.set===idx?'✓ Active Preset':'Use This Preset'}</button>
      </div>
    `).join('')}
  `;
  app.querySelectorAll('[data-set]').forEach(btn=>{
    btn.onclick=()=>{state.set=Number(btn.dataset.set);renderLight();};
  });
}

function getSavedItems(){
  return [...state.checked].map(k=>{
    const [c,t,i]=k.split(':').map(Number);
    if(CATS[c]&&LS(c,t)[i]) return {p:gen(c,state.set,t,i),key:k};
    return null;
  }).filter(Boolean);
}

function renderShootMode(){
  renderNav('#check');
  const app=document.getElementById('app');
  const items=getSavedItems();
  if(!items.length){location.hash='#check';return;}
  state.shootIdx=cl(state.shootIdx,0,items.length-1);
  const {p,key}=items[state.shootIdx];
  const animClass=state.swipeDir==='next'?'anim-next':state.swipeDir==='prev'?'anim-prev':'';
  state.swipeDir=null;

  const nextShot=()=>{
    state.swipeDir='next';
    state.shootIdx=(state.shootIdx+1)%items.length;
    renderShootMode();
  };
  const prevShot=()=>{
    state.swipeDir='prev';
    state.shootIdx=(state.shootIdx-1+items.length)%items.length;
    renderShootMode();
  };

  app.innerHTML=`
    <div class="head-row">
      <a class="back" href="#check">← Exit Shoot Mode</a>
      <span class="crumb">SHOT ${state.shootIdx+1} OF ${items.length}</span>
    </div>
    <div class="swipe-stage ${animClass}" id="shootSwipeStage">
      <h2>${esc(p.name)}</h2>
      <p class="sub">${esc(p.C.n)} · ${esc(sum(p))}</p>
      <div class="hero">${poseSvg(p,state.mirror,true)}</div>
      <div class="swipe-hint">
        <span>← Swipe Prev</span>
        <div class="dots" aria-hidden="true">
          ${items.map((_,dIdx)=>`<span class="${dIdx===state.shootIdx?'on':''}"></span>`).join('')}
        </div>
        <span>Swipe Next →</span>
      </div>
      <div class="prompt-box">
        <div class="crumb">🗣️ SAY THIS NOW</div>
        <q>${esc(getDirectorPrompt(p))}</q>
      </div>
      <div class="card">
        <p><b>Camera:</b> ${esc(p.cam)}</p>
        <p><b>Cue:</b> ${esc(p.tip)}</p>
      </div>
    </div>
    <div class="nav">
      <button id="prevShot">← Prev Shot</button>
      <button id="doneShot">✓ Done &amp; Next</button>
    </div>
  `;

  attachSwipe(document.getElementById('shootSwipeStage'), {onNext:nextShot, onPrev:prevShot});
  document.getElementById('prevShot').onclick=prevShot;
  document.getElementById('doneShot').onclick=()=>{
    state.checked.delete(key);
    saveState();
    const rem=getSavedItems();
    if(!rem.length){location.hash='#check';return;}
    state.swipeDir='next';
    state.shootIdx=cl(state.shootIdx,0,rem.length-1);
    renderShootMode();
  };
}

function renderCheck(){
  renderNav('#check');
  const app=document.getElementById('app');
  const items=getSavedItems();

  app.innerHTML=`
    <h1>Shoot Run-Sheet</h1>
    <p class="sub">${items.length} shot${items.length===1?'':'s'} queued for this session</p>
    ${items.length ? `<button class="btn" id="startShootBtn">🎬 Start Shoot Mode (${items.length} Flashcards)</button>` : ''}
    ${items.length ? items.map(({p,key})=>`
      <div class="row">
        <a href="#detail?c=${p.c}&t=${p.t}&i=${p.i}" style="display:flex;gap:12px;align-items:center;flex:1;min-width:0">
          <span class="em">${p.C.e}</span>
          <div>
            <b>${esc(p.name)}</b>
            <small>${esc(p.C.n)} · ${esc(sum(p))}</small>
          </div>
        </a>
        <button class="chk on" data-rm="${esc(key)}" title="Mark shot done" aria-label="Remove ${esc(p.name)}">✓</button>
      </div>
    `).join('') : `<div class="card"><p>Build your shot list before or during a shoot—open any pose and tap <b>Save to Shoot Run-Sheet</b>.</p></div>`}
    ${items.length ? `<button class="btn sec" id="clearChk">Clear Run-Sheet</button>` : ''}
  `;
  const startBtn=document.getElementById('startShootBtn');
  if(startBtn) startBtn.onclick=()=>{state.shootIdx=0;location.hash='#shoot';};
  app.querySelectorAll('[data-rm]').forEach(btn=>{
    btn.onclick=()=>{state.checked.delete(btn.dataset.rm);saveState();renderCheck();};
  });
  const clr=document.getElementById('clearChk');
  if(clr) clr.onclick=()=>{state.checked.clear();saveState();renderCheck();};
}

function parseHash(){
  const h=(location.hash||'#home').slice(1);
  const [route,qs]=h.split('?');
  const params=new URLSearchParams(qs||'');
  return {route:route||'home',params};
}

function render(){
  const {route,params}=parseHash();
  const app=document.getElementById('app');
  app.classList.remove('in');
  void app.offsetWidth;
  app.classList.add('in');
  if(params.has('c')){
    const nextCat=cl(Number(params.get('c')),0,CATS.length-1);
    if(nextCat!==state.cat) state.sub='All';
    state.cat=nextCat;
  }
  if(params.has('t')){
    const nextType=cl(Number(params.get('t')),0,2);
    if(nextType!==state.type) state.sub='All';
    state.type=nextType;
  }

  if(route==='poses') renderPoses();
  else if(route==='detail') renderDetail(params);
  else if(route==='light') renderLight();
  else if(route==='shoot') renderShootMode();
  else if(route==='check') renderCheck();
  else renderHome();
}

window.addEventListener('keydown', e=>{
  const {route,params}=parseHash();
  if(route==='detail'){
    const c=cl(Number(params.get('c')??state.cat),0,CATS.length-1);
    const t=cl(Number(params.get('t')??state.type),0,2);
    const arr=LS(c,t);
    const i=cl(Number(params.get('i')||0),0,Math.max(0,arr.length-1));
    if(e.key==='ArrowRight'){state.swipeDir='next';location.hash=`#detail?c=${c}&t=${t}&i=${(i+1)%arr.length}`;}
    if(e.key==='ArrowLeft'){state.swipeDir='prev';location.hash=`#detail?c=${c}&t=${t}&i=${(i-1+arr.length)%arr.length}`;}
  } else if(route==='shoot'){
    const items=getSavedItems();
    if(!items.length) return;
    if(e.key==='ArrowRight'){state.swipeDir='next';state.shootIdx=(state.shootIdx+1)%items.length;renderShootMode();}
    if(e.key==='ArrowLeft'){state.swipeDir='prev';state.shootIdx=(state.shootIdx-1+items.length)%items.length;renderShootMode();}
  }
});

window.addEventListener('hashchange',render);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',syncThemeMeta);
if(!location.hash) location.hash='#home';
render();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body></html>
